{% extends 'base.html' %}

{% block title %}Confirm Deletion{% endblock %}

{% block content %}
    <div class="container mt-5">
        <h2>Confirm Deletion</h2>
        <p>Are you sure you want to delete the account: <strong>{{ account.account_type }}</strong>?</p>
        
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Delete</button>
            <a href="{% url 'view_accounts' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
{% endblock %}
