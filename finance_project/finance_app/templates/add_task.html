{% extends 'base.html' %}

{% block content %}
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-lg">
          <div class="card-header text-center">
            <h2>{% if task %}Edit Task{% else %}Create a New Task{% endif %}</h2>
          </div>
          <div class="card-body">
            <form method="post">
              {% csrf_token %}

              <!-- Render name field -->
              <div class="form-group">
                <label for="{{ task_form.name.id_for_label }}">Task Name:</label>
                {{ task_form.name }}
              </div>

              <!-- Render due date field -->
              <div class="form-group">
                <label for="{{ task_form.due_date.id_for_label }}">Due Date:</label>
                {{ task_form.due_date }}
              </div>

              <!-- Render description field -->
              <div class="form-group">
                <label for="{{ task_form.description.id_for_label }}">Description:</label>
                {{ task_form.description }}
              </div>

              <div class="form-group text-center">
                <button type="submit" class="btn btn-primary btn-block">
                  {% if task %}Update Task{% else %}Create Task{% endif %}
                </button>
              </div>
            </form>

            {% if task %}
              <!-- Delete Button -->
              <form method="POST" action="{% url 'delete_task' task.id %}" class="mt-3">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger btn-block">Delete Task</button>
              </form>
            {% endif %}
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
