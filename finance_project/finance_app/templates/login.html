{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card p-5 shadow-sm" style="max-width: 400px; width: 100%; border-radius: 10px;">
        <h2 class="text-center mb-4" style="font-weight: bold; color: #333;">Login</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100" style="font-weight: bold;">Login</button>
        </form>
            <a href="{% url 'register' %}" class="btn btn-primary w-100 mt-3 text-decoration-none" style="font-weight: bold; display: inline-block; text-align: center;">Register</a>
        </form>
    </div>
</div>
{% endblock %}
