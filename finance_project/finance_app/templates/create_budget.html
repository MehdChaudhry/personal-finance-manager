{% extends 'base.html' %}

{% block title %}Create Budget{% endblock %}

{% block content %}
    <div class="container mt-5">
        <h1>Create Budget</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            {{ formset.management_form }}
            {% for form in formset %}
                {{ form.as_p }}
            {% endfor %}
            <button type="submit" class="btn btn-primary">Save</button>
        </form>
    </div>
{% endblock %}
